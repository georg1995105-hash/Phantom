name: Android build and unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, redesign/v02-foundation, redesign/reference-preview-20261105]

permissions:
  contents: write

jobs:
  build:
    name: Compile and test (GitHub runner)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform 37.0 and NDK 28
        shell: bash
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.0.13004108"

      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android debug APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebugNoMinify

      - name: Run Android unit tests
        shell: bash
        run: |
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Record APK checksum
        shell: bash
        run: |
          set -euo pipefail
          sha256sum app/build/outputs/apk/debugNoMinify/*.apk | tee SHA256SUMS.txt
          cat SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Build separately installable preview APK
        shell: bash
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleDebugNoMinify -PsmartvoicePreview=true

      - name: Record preview APK checksum
        shell: bash
        run: |
          set -euo pipefail
          sha256sum app/build/outputs/apk/debugNoMinify/*.apk | tee PREVIEW_SHA256SUMS.txt
          cat PREVIEW_SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Save APK as a private test release (Actions storage quota workaround)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 7 && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VISIBILITY="$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq '.visibility' | tr '[:upper:]' '[:lower:]')"
          if [[ "$VISIBILITY" != "private" ]]; then
            echo "::error::Refusing to publish a test APK in a non-private repository"
            exit 1
          fi
          APK="$(find app/build/outputs/apk/debugNoMinify -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          sha256sum --check PREVIEW_SHA256SUMS.txt
          TAG="smartvoice-test-pr7-${GITHUB_SHA:0:12}"
          gh release create "$TAG" "$APK" PREVIEW_SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SmartVoice Test Fix · PR #7 · ${GITHUB_SHA:0:12}" \
            --notes "Private test APK built and unit-tested from this PR merge commit. Not a stable release. Phone testing is still required." \
            --prerelease --latest=false
          URL="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          echo "Private test APK: $URL" >> "$GITHUB_STEP_SUMMARY"
