name: Android debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install exact Android platform and NDK
        shell: bash
        run: |
          sdkmanager --install "platforms;android-37" "ndk;28.0.13004108"

      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build installable debug APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebugNoMinify

      - name: Generate artifact checksum
        shell: bash
        run: |
          find app/build/outputs/apk/debugNoMinify -maxdepth 1 -name '*.apk' -type f -print
          sha256sum app/build/outputs/apk/debugNoMinify/*.apk | tee SHA256SUMS.txt

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartVoiceKeyboard-debug-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debugNoMinify/*.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Run unit tests
        shell: bash
        run: |
          ./gradlew --no-daemon --stacktrace :app:testDebugNoMinifyUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartVoiceKeyboard-tests-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
