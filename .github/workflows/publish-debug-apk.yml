name: Publish private debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build, test and attach APK to GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform 37.0 and NDK 28
        shell: bash
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.0.13004108"

      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android debug APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebugNoMinify

      - name: Run Android unit tests
        shell: bash
        run: |
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Record APK checksum
        shell: bash
        run: |
          set -euo pipefail
          sha256sum app/build/outputs/apk/debugNoMinify/*.apk | tee SHA256SUMS.txt
          cat SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Publish debug APK to this private repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/debugNoMinify -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          TAG="debug-run-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:8}"
          gh release create "$TAG" "$APK_PATH" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SmartVoiceKeyboard debug build #${GITHUB_RUN_NUMBER}" \
            --notes "Personal debug APK. Built and unit-tested by GitHub Actions from commit ${GITHUB_SHA}. Debug signed; not a production release." \
            --prerelease \
            --latest=false
          RELEASE_URL="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
          echo "APK Release: $RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Release created: $RELEASE_URL"
