name: Publish private debug APK

on:
  workflow_dispatch:
    inputs:
      approved_preview:
        description: Build separately installable approved-design preview with comparison screenshots
        type: boolean
        default: false

      evidence_only:
        description: Refresh verified screenshots and report without rebuilding or re-signing the published preview
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    name: Build and attach private debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: ${{ !inputs.evidence_only }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform 37.0 and NDK 28
        if: ${{ !inputs.evidence_only }}
        shell: bash
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.0.13004108"

      - name: Set up Gradle build cache
        if: ${{ !inputs.evidence_only }}
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android debug APK
        if: ${{ !inputs.evidence_only }}
        shell: bash
        run: |
          chmod +x ./gradlew
          PREVIEW_ARGS=()
          if [[ '${{ inputs.approved_preview }}' == 'true' ]]; then
            PREVIEW_ARGS+=('-PsmartvoicePreview=true')
          fi
          ./gradlew --no-daemon --stacktrace :app:assembleDebugNoMinify "${PREVIEW_ARGS[@]}"

      - name: Reuse the exact published APK for evidence refresh
        if: inputs.approved_preview && inputs.evidence_only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/build/outputs/apk/debugNoMinify
          gh release download preview-input-fixes-20261105 --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir app/build/outputs/apk/debugNoMinify

      - name: Package approved preview evidence
        if: inputs.approved_preview
        run: python3 tools/package-preview.py

      - name: Publish approved preview to this private repository
        if: inputs.approved_preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="preview-input-fixes-20261105"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --latest=false --title 'SmartVoice Test — исправления ввода и истории · 2026-11-05'
          gh release upload "$TAG" preview-assets/*.apk preview-assets/*.zip preview-assets/*.png preview-assets/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          TARGET_ARGS=()
          if [[ '${{ inputs.evidence_only }}' != 'true' ]]; then TARGET_ARGS+=(--target "$GITHUB_SHA"); fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" "${TARGET_ARGS[@]}" --notes-file preview-assets/RELEASE_NOTES.md --draft=false --prerelease --latest=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets >> "$GITHUB_STEP_SUMMARY"

      - name: Record APK checksum
        if: ${{ !inputs.approved_preview }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum app/build/outputs/apk/debugNoMinify/*.apk | tee SHA256SUMS.txt
          cat SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Publish debug APK to this private repository
        if: ${{ !inputs.approved_preview }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/debugNoMinify -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          TAG="debug-run-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:8}"
          gh release create "$TAG" "$APK_PATH" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SmartVoiceKeyboard 0.2.0-alpha5 debug #${GITHUB_RUN_NUMBER}" \
            --notes "Personal debug APK built from commit ${GITHUB_SHA}. Unit tests run separately in the Android Debug CI workflow; check its result. Personal test APK, not a production release." \
            --prerelease \
            --latest=false
          RELEASE_URL="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
          echo "APK Release: $RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Release created: $RELEASE_URL"

