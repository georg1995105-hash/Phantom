name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Manual release channel (beta is a separate Android package)'
        required: true
        default: stable
        type: choice
        options: [stable, beta]
      release_tag:
        description: 'If set, publish signed APK as a GitHub Release with this tag'
        required: false
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]

# All untrusted PR code runs with a read-only token.
# Only the dedicated publish job can create a GitHub Release.
permissions:
  contents: read
  actions: read

# A new PR commit supersedes older unverified PR builds. Do not cancel
# production releases: they use distinct refs and cancel-in-progress=false.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # The reviewed PR branch may be released on the owner's explicit manual action.
    # No merge to main or release on PR push is implied.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/qa/universal-hardening-20261120' && github.actor == 'georg1995105-hash')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" 2>&1 | tail -5

      - name: Download libv2ray.aar (Xray core)
        run: |
          mkdir -p app/libs
          curl -fSL -o app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar
          echo "cdfef146218233a31a8b52c8b1016557730d3b63fc121d4c84cacea50e669155  app/libs/libv2ray.aar" | sha256sum -c -
          ls -lh app/libs/

      - name: Download and isolate pinned sing-box libbox AAR
        run: |
          curl --retry 3 -fSL -o app/libs/libbox-original.aar \
            https://github.com/singbox-android/libbox/releases/download/1.14.4/libbox.aar
          echo "d2685924a657705beda44e94c6dc499e781df1ad20d65474e3591ec2f8b96465  app/libs/libbox-original.aar" | sha256sum -c -
          echo 'lief==1.0.0 --hash=sha256:41ff868f5328fc8e5237a9e1f4718590e0ee9180c1422b3e4948b7116ba4517c' > "$RUNNER_TEMP/lief.txt"
          python3 -m pip install --no-cache-dir --user --only-binary=:all: --no-deps --require-hashes -r "$RUNNER_TEMP/lief.txt"
          python3 scripts/isolate_libbox_aar.py app/libs/libbox-original.aar app/libs/libbox-isolated.aar
          rm app/libs/libbox-original.aar
          unzip -l app/libs/libbox-isolated.aar | grep -E 'lib(box|sbjni).so' | head -4
          ls -lh app/libs/

      - name: Download pinned Xray geo databases
        run: |
          mkdir -p app/src/main/assets
          curl --retry 3 -fSL -o app/src/main/assets/geoip.dat \
            https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/202611152204/geoip.dat
          curl --retry 3 -fSL -o app/src/main/assets/geosite.dat \
            https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/202611152204/geosite.dat
          echo "304ac8a1cbcc8166e4f5a4f32955e4d0fb77a1bd713583e371b30ee27f3659d8  app/src/main/assets/geoip.dat" | sha256sum -c -
          echo "269f7740e328b592376ea99f2adb12f83d5bc17b024e584c8a7b3706ba5c789d  app/src/main/assets/geosite.dat" | sha256sum -c -

      - name: Verify release notes match APK version
        run: |
          VERSION=$(awk -F '"' '/versionName =/ { print $2; exit }' app/build.gradle.kts)
          test -n "$VERSION"
          grep -Fxq "# PHANTOM VPN $VERSION" RELEASE_NOTES.md

      - name: Build release APK
        env:
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          chmod +x gradlew
          set +e
          tasks=(:app:testDebugUnitTest :app:lintRelease :app:assembleRelease)
          beta_args=()
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" || "${RELEASE_CHANNEL:-stable}" == "beta" ]]; then
            tasks+=(:app:testBetaUnitTest :app:lintBeta :app:assembleBeta)
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${RELEASE_CHANNEL:-stable}" == "beta" ]]; then
            # Each published beta must increase versionCode, even within the
            # same stable base version: beta.1=34001, beta.2=34002, etc.
            if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-beta\.([1-9][0-9]*)$ ]]; then
              echo "::error::Expected a tag like v0.3.7-beta.2"; exit 1
            fi
            beta_base="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            beta_number="${BASH_REMATCH[4]}"
            stable_version=$(awk -F '"' '/versionName =/ { print $2; exit }' app/build.gradle.kts)
            stable_code=$(awk '/^[[:space:]]*versionCode =/ { print $3; exit }' app/build.gradle.kts)
            if [[ "$beta_base" != "$stable_version" || ! "$stable_code" =~ ^[0-9]+$ ]]; then
              echo "::error::Beta base must equal the source stable version"; exit 1
            fi
            if (( beta_number > 999 )); then
              echo "::error::Beta ordinal must be between 1 and 999"; exit 1
            fi
            beta_code=$((stable_code * 1000 + beta_number))
            beta_args+=("-PphantomBetaVersion=${RELEASE_TAG#v}" "-PphantomBetaCode=$beta_code")
            echo "Building beta version=${RELEASE_TAG#v} versionCode=$beta_code"
          fi
          ./gradlew --no-daemon --max-workers=1 --stacktrace "${beta_args[@]}" "${tasks[@]}"
          result=$?
          if [ "$result" -ne 0 ]; then
            report=app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
            if [ -f "$report" ]; then
              echo "::group::Android Lint full findings"
              sed -n '1,220p' "$report"
              echo "::endgroup::"
            fi
          fi
          exit "$result"

      - name: Generate disposable CI signing key (no release secrets)
        if: github.event_name != 'workflow_dispatch'
        run: |
          # A fresh, non-production key for EACH CI run.
          # A PR cannot access or sign an APK with the production key.
          keytool -genkeypair -noprompt -keystore app/keystore.jks \
            -storepass phantom-ci-only-2026 -keypass phantom-ci-only-2026 \
            -alias ci-ephemeral -keyalg RSA -keysize 3072 -validity 1 \
            -dname "CN=Phantom CI Temporary,O=Tests"

      - name: Restore production signing key (manual release only)
        if: github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_B64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/keystore.jks
          test -s app/keystore.jks

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.APP_KEYSTORE_PASSWORD || 'phantom-ci-only-2026' }}
          KEYSTORE_ALIAS: ${{ github.event_name == 'workflow_dispatch' && secrets.APP_KEYSTORE_ALIAS || 'ci-ephemeral' }}
          KEY_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.APP_KEY_PASSWORD || 'phantom-ci-only-2026' }}
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64 x86 universal; do
            dir=app/build/outputs/apk/release
            unsigned="$dir/app-$abi-release-unsigned.apk"
            signed="$dir/phantom-$abi-release.apk"
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 4 "$unsigned" "aligned-$abi.apk"
            # Android 11 incremental extraction matches lib/x86_64 for lib/x86.
            # Distribute a standalone package with v2/v3 signing for full installs.
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
              --ks app/keystore.jks --ks-key-alias "$KEYSTORE_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --v4-signing-enabled false \
              --out "$signed" "aligned-$abi.apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$signed"
            rm "aligned-$abi.apk"
          done
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            for lib in libgojni.so libbox.so; do
              unzip -Z1 "$dir/phantom-universal-release.apk" "lib/$abi/$lib" > /dev/null
            done
          done
          # Sign beta separately; its package identity cannot replace stable.
          beta_dir=app/build/outputs/apk/beta
          if [[ -f "$beta_dir/app-universal-beta-unsigned.apk" ]]; then
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 4 \
              "$beta_dir/app-universal-beta-unsigned.apk" "aligned-beta.apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
              --ks app/keystore.jks --ks-key-alias "$KEYSTORE_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --v4-signing-enabled false \
              --out "$beta_dir/phantom-beta-universal-release.apk" "aligned-beta.apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$beta_dir/phantom-beta-universal-release.apk"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$beta_dir/phantom-beta-universal-release.apk" | grep -F "package: name='xyz.wraithnet.phantom.beta'"
            rm "aligned-beta.apk"
          fi
          # Never keep the production signing material on the test runner.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            rm -f app/keystore.jks
          fi

      - name: Test universal APK audit itself
        run: |
          python3 -m unittest discover -s scripts -p 'test_universal_audit.py' -v
          python3 -m unittest discover -s scripts -p 'test_installed_native.py' -v

      - name: Verify all native ABI and 16 KiB ELF segments in signed universal APK
        run: |
          apk=app/build/outputs/apk/release/phantom-universal-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
          stat --format='Universal APK: %s bytes' "$apk"
          sha256sum "$apk"
          python3 scripts/audit_universal_apk.py \
            "$apk"
          beta=app/build/outputs/apk/beta/phantom-beta-universal-release.apk
          if [[ -f "$beta" ]]; then
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$beta"
            python3 scripts/audit_universal_apk.py "$beta"
          fi

      - name: Prepare loopback protocol peers
        if: github.event_name != 'push'
        run: |
          mkdir -p "$RUNNER_TEMP/peers"
          cd "$RUNNER_TEMP/peers"
          curl -fsSL --retry 3 -o xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-linux-64.zip
          curl -fsSL --retry 3 -o singbox.tgz https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64.tar.gz
          echo 'b651f7e1d9966ee2c1b1ee1bf8b52c72771824d3065dce96bbc8bcc19ed95f82  xray.zip' | sha256sum -c -
          echo '699a1b510aa4396b2176d32d1181920399ebf1e267835da6f3b598d0f7c24968  singbox.tgz' | sha256sum -c -
          unzip -q xray.zip xray
          tar -xf singbox.tgz --strip-components=1 sing-box-1.14.4-linux-amd64/sing-box
          python3 "$GITHUB_WORKSPACE/scripts/ci_protocol_peers.py" "$PWD/xray" "$PWD/sing-box" "$GITHUB_WORKSPACE/app/src/androidTest/assets/peers.json" > peers.log 2>&1 &
          for attempt in {1..15}; do
            if curl -fsS http://127.0.0.1:34301/ready; then exit 0; fi
            sleep 1
          done
          cat peers.log
          exit 1

      - name: Verify signed 0.3.8 baseline and upgrade signer
        if: github.event_name != 'push'
        run: |
          curl --retry 3 -fsSL -o previous.apk https://github.com/georg1995105-hash/Phantom/releases/download/v0.3.8/phantom-x86_64-release.apk
          echo '9f6e581794041dfe9dd30b102dfc4131de844c86ef3b7e704d35b169f3b8c518  previous.apk' | sha256sum -c -
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          cert='Signer #1 certificate SHA-256 digest: 86bc0b32349dec451d94ed402a1addc1ad3ec6084439cb8dc05aee88e5d8a4ca'
          "$signer" verify --print-certs previous.apk | grep -Fx "$cert"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            for apk in app/build/outputs/apk/release/phantom-*-release.apk; do
              "$signer" verify --print-certs "$apk" | grep -Fx "$cert"
            done
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # Re-sign the baseline with this run's ephemeral CI key so the
            # Android upgrade test still checks real in-place user data.
            # The production signing key never enters a PR runner.
            "$signer" sign --ks app/keystore.jks --ks-key-alias ci-ephemeral \
              --ks-pass pass:phantom-ci-only-2026 --key-pass pass:phantom-ci-only-2026 \
              --v4-signing-enabled false \
              --out previous-ci.apk previous.apk
            mv previous-ci.apk previous.apk
            "$signer" verify previous.apk
          fi

      - name: Enable emulator hardware acceleration
        if: github.event_name != 'push'
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Run dual Go runtime JNI smoke test on Android
        id: android_native
        if: github.event_name != 'push'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          # Pixel Launcher from google_apis displayed its ANR over the clipboard test.
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back imagefile:${{ runner.temp }}/phantom-subscription.png
          pre-emulator-launch-script: bash scripts/ci_qr_camera.sh
          disable-animations: true
          script: |
            bash scripts/ci_emulator.sh

      - name: Install verified Android TV x86 system image
        id: android_tv_image
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          set -euo pipefail
          archive=$(mktemp "$RUNNER_TEMP/android-tv.XXXXXX.zip")
          trap 'rm -f "$archive"' EXIT
          curl -fsSL --max-time 120 -o "$archive" \
            https://dl.google.com/android/repository/sys-img/android-tv/x86-30_r04.zip
          printf '%s  %s\n' da16c0dbf88fecbc4b64912c184bc0d6c955c9483a5894cca47f55f6744c02d3 "$archive" | sha256sum -c -
          image_root="$ANDROID_HOME/system-images/android-30/android-tv"
          mkdir -p "$image_root"
          unzip -oq "$archive" -d "$image_root"
          sdkmanager --list_installed | grep -F 'system-images;android-30;android-tv;x86'

      - name: Test universal APK with an Android TV remote
        id: android_tv
        if: github.event_name != 'push' && steps.android_tv_image.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          avd-name: phantom-tv
          disk-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: python3 scripts/ci_tv.py

      - name: Test signed universal APK on Android with 16 KiB pages
        id: android_16k
        if: github.event_name != 'push'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          # The Android 15 experimental image also crashed in Android SystemUI.
          api-level: 36
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_6
          avd-name: phantom-16k
          disk-size: 3072M
          # The 16 KiB Google APIs image had LMK deaths with the default guest RAM.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          disable-animations: true
          script: python3 scripts/ci_tv.py --16k

      - name: Enforce successful device tests
        if: github.event_name != 'push'
        run: |
          result=0
          if [ "${{ steps.android_native.outcome }}" != "success" ]; then
            echo "::error::Android instrumentation and upgrade tests failed"
            result=1
          fi
          if [ "${{ steps.android_tv.outcome }}" != "success" ]; then
            echo "::error::Android TV VPN and D-pad tests failed"
            result=1
          fi
          if [ "${{ steps.android_16k.outcome }}" != "success" ]; then
            echo "::error::Android 16 KiB runtime tests failed"
            result=1
          fi
          exit "$result"

      - name: Upload upgrade screenshots
        if: ${{ !cancelled() && github.event_name != 'push' && hashFiles('upgrade-screens/*.png') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: upgrade-screens
          path: upgrade-screens/
          retention-days: 7

      - name: Stage universal PR test APK
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p pr-artifact
          cp app/build/outputs/apk/release/phantom-universal-release.apk pr-artifact/Phantom.apk

      - name: Upload PR test APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phantom-pr-universal-ci-signed
          path: pr-artifact/Phantom.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

      - name: Upload verified release APKs
        if: github.event_name == 'workflow_dispatch' && inputs.release_channel == 'stable'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phantom-release
          # Keep ABI-named APK assets while older installed clients still select
          # architecture-specific assets from the latest GitHub Release.
          path: app/build/outputs/apk/release/phantom-*-release.apk
          compression-level: 0
          retention-days: 2

      - name: Upload verified beta APK
        if: github.event_name == 'workflow_dispatch' && inputs.release_channel == 'beta'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phantom-beta-release
          path: app/build/outputs/apk/beta/phantom-beta-universal-release.apk
          compression-level: 0
          retention-days: 2

  # This job never executes project code or receives signing keys.
  # It publishes only the already-signed, tested build artifacts.
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Download verified signed APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: phantom-*
          path: release-assets/
          merge-multiple: true

      - name: Validate requested version and assets
        if: inputs.release_channel == 'stable'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version=$(awk -F '"' '/versionName =/ { print $2; exit }' app/build.gradle.kts)
          test "$RELEASE_TAG" = "v$version"
          test -s "release-assets/phantom-universal-release.apk"
          # All prior ABI-specific OTA clients must retain a matching asset even
          # when a later release becomes the latest stable version.
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            test -s "release-assets/phantom-$abi-release.apk"
          done
          sha256sum release-assets/phantom-*-release.apk

      - name: Stage official universal and legacy architecture APKs
        if: inputs.release_channel == 'stable'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p publish-assets
          cp release-assets/phantom-*-release.apk publish-assets/
          sha256sum publish-assets/phantom-*-release.apk

      - name: Publish official release
        if: inputs.release_channel == 'stable'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: PHANTOM VPN ${{ inputs.release_tag }}
          files: publish-assets/phantom-*-release.apk
          prerelease: false
          body_path: RELEASE_NOTES.md

      - name: Ensure Android build tools for beta APK validation
        if: inputs.release_channel == 'beta'
        run: |
          set -euo pipefail
          if [[ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt" || ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
            test -n "$sdkmanager"
            "$sdkmanager" --install "build-tools;35.0.0"
          fi

      - name: Validate beta tag and signed artifact
        if: inputs.release_channel == 'beta'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          beta=release-assets/phantom-beta-universal-release.apk
          test -s "$beta"
          actual=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$beta" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          test -n "$actual"
          test "$RELEASE_TAG" = "v$actual"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$beta"
          sha256sum "$beta"

      - name: Publish prerelease to beta channel
        if: inputs.release_channel == 'beta'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: PHANTOM VPN Beta ${{ inputs.release_tag }}
          files: release-assets/phantom-beta-universal-release.apk
          prerelease: true
          make_latest: false
          body_path: BETA_RELEASE_NOTES.md
