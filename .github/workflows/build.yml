name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'If set, publish signed APK as a GitHub Release with this tag'
        required: false
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" 2>&1 | tail -5

      - name: Download libv2ray.aar (Xray core)
        run: |
          mkdir -p app/libs
          curl -fSL -o app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar
          echo "cdfef146218233a31a8b52c8b1016557730d3b63fc121d4c84cacea50e669155  app/libs/libv2ray.aar" | sha256sum -c -
          ls -lh app/libs/

      - name: Download and isolate pinned sing-box libbox AAR
        run: |
          curl --retry 3 -fSL -o app/libs/libbox-original.aar \
            https://github.com/singbox-android/libbox/releases/download/1.14.4/libbox.aar
          echo "d2685924a657705beda44e94c6dc499e781df1ad20d65474e3591ec2f8b96465  app/libs/libbox-original.aar" | sha256sum -c -
          python3 -m pip install --no-cache-dir --user "lief==1.0.0"
          python3 scripts/isolate_libbox_aar.py app/libs/libbox-original.aar app/libs/libbox-isolated.aar
          rm app/libs/libbox-original.aar
          unzip -l app/libs/libbox-isolated.aar | grep -E 'lib(box|sbjni).so' | head -4
          ls -lh app/libs/

      - name: Download pinned Xray geo databases
        run: |
          mkdir -p app/src/main/assets
          curl --retry 3 -fSL -o app/src/main/assets/geoip.dat \
            https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/202611152204/geoip.dat
          curl --retry 3 -fSL -o app/src/main/assets/geosite.dat \
            https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/202611152204/geosite.dat
          echo "304ac8a1cbcc8166e4f5a4f32955e4d0fb77a1bd713583e371b30ee27f3659d8  app/src/main/assets/geoip.dat" | sha256sum -c -
          echo "269f7740e328b592376ea99f2adb12f83d5bc17b024e584c8a7b3706ba5c789d  app/src/main/assets/geosite.dat" | sha256sum -c -

      - name: Restore keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > app/keystore.jks
          ls -lh app/keystore.jks

      - name: Verify release notes match APK version
        run: |
          VERSION=$(awk -F '"' '/versionName =/ { print $2; exit }' app/build.gradle.kts)
          test -n "$VERSION"
          grep -Fxq "# PHANTOM VPN $VERSION" RELEASE_NOTES.md

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Enable emulator hardware acceleration
        if: github.event_name == 'pull_request'
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Run dual Go runtime JNI smoke test on Android
        if: github.event_name == 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/ci_native_smoke.sh

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          UNSIGNED=$(find app/build/outputs/apk/release -name "*-unsigned.apk" | head -1)
          if [ -z "$UNSIGNED" ]; then
            UNSIGNED=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          fi
          SIGNED="app/build/outputs/apk/release/phantom-arm64-v8a-release.apk"
          $ANDROID_HOME/build-tools/35.0.0/zipalign -v -p 4 "$UNSIGNED" aligned.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks app/keystore.jks \
            --ks-key-alias "$KEYSTORE_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED" aligned.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify "$SIGNED"
          ls -lh "$SIGNED"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: phantom-arm64-v8a
          path: app/build/outputs/apk/release/phantom-arm64-v8a-release.apk
          retention-days: 30

      - name: Publish release (optional)
        if: (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && 'v0.2.20' || inputs.release_tag }}
          name: PHANTOM VPN 0.2.20
          files: app/build/outputs/apk/release/phantom-arm64-v8a-release.apk
          prerelease: true
          body_path: RELEASE_NOTES.md
