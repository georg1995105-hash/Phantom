name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'If set, publish signed APK as a GitHub Release with this tag'
        required: false
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  ensure-keystore:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check if keystore secret exists
        id: check
        env:
          SECRET: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SECRET" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate keystore and upload to secrets (first run only)
        if: steps.check.outputs.ready == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PASS=$(openssl rand -hex 24)
          keytool -genkeypair -v \
            -keystore phantom.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias phantom \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=PHANTOM VPN, OU=Dev, O=WraithNet, L=EU, ST=EU, C=EU"

          B64=$(base64 -w0 phantom.jks)

          # Upload secrets via GitHub CLI
          echo "$B64"  | gh secret set APP_KEYSTORE_BASE64  --repo ${{ github.repository }}
          echo "$PASS" | gh secret set APP_KEYSTORE_PASSWORD --repo ${{ github.repository }}
          echo "phantom" | gh secret set APP_KEYSTORE_ALIAS   --repo ${{ github.repository }}
          echo "$PASS" | gh secret set APP_KEY_PASSWORD     --repo ${{ github.repository }}

          # Wipe local copy
          shred -u phantom.jks || true
          unset PASS B64
          echo "Keystore generated and stored in repo secrets."

  build:
    needs: ensure-keystore
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Download libv2ray.aar (Xray core)
        run: |
          mkdir -p app/libs
          curl -fSL -o app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar
          ls -lh app/libs/

      - name: Restore keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > app/keystore.jks
          ls -lh app/keystore.jks

      - name: Build release APK (arm64-v8a)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          UNSIGNED=$(find app/build/outputs/apk/release -name "*-unsigned.apk" | head -1)
          if [ -z "$UNSIGNED" ]; then
            UNSIGNED=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          fi
          SIGNED="app/build/outputs/apk/release/phantom-arm64-v8a-release.apk"
          $ANDROID_HOME/build-tools/35.0.0/zipalign -v -p 4 "$UNSIGNED" aligned.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks app/keystore.jks \
            --ks-key-alias "$KEYSTORE_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED" aligned.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify "$SIGNED"
          ls -lh "$SIGNED"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: phantom-arm64-v8a
          path: app/build/outputs/apk/release/phantom-arm64-v8a-release.apk
          retention-days: 30

      - name: Publish release (optional)
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: PHANTOM ${{ inputs.release_tag }}
          files: app/build/outputs/apk/release/phantom-arm64-v8a-release.apk
          prerelease: true
