name: Build SmartVoice test APK

on:
  pull_request:
    branches: [redesign/v02-foundation]
    paths:
      - 'app/**'
      - '.github/workflows/preview-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Build separate test keyboard APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.0.13004108"
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Build independent preview APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebugNoMinify -PsmartvoicePreview=true
          APK="$(find app/build/outputs/apk/debugNoMinify -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -s "$APK"
          sha256sum "$APK" | tee SHA256SUMS.txt
          echo "Preview branch SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Test package: ru.smartvoice.keyboard.preview (installs separately)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartVoice-Test-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debugNoMinify/*.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
