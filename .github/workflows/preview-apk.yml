name: Build SmartVoice test APK

on:
  push:
    branches: [fix/redesign-toolbar-20261105]
    paths:
      - 'app/**'
      - '.github/workflows/preview-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    name: Build separate test keyboard APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.0.13004108"
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Build independent preview APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebugNoMinify -PsmartvoicePreview=true
          APK="$(find app/build/outputs/apk/debugNoMinify -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -s "$APK"
          sha256sum "$APK" | tee SHA256SUMS.txt
          echo "Preview branch SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Test package: ru.smartvoice.keyboard.preview (installs separately)" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish separate test APK to private GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debugNoMinify -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          TAG="smartvoice-preview-${GITHUB_SHA:0:12}"
          gh release create "$TAG" "$APK" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SmartVoice Test ${GITHUB_SHA:0:8} - preview only" \
            --notes "Independent test keyboard (ru.smartvoice.keyboard.preview). Not a stable release. Existing keyboard stays installed. Built from commit $GITHUB_SHA." \
            --prerelease --latest=false
          URL="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
          echo "Download test APK: $URL" >> "$GITHUB_STEP_SUMMARY"
