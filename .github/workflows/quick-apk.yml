name: Quick signed universal APK

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Optional exact source commit; leave blank for current main'
        required: false
        default: ''
        type: string
      publish_release:
        description: 'Publish a stable universal APK and OTA immediately after signing'
        required: true
        default: true
        type: boolean
      release_channel:
        description: 'Release channel; beta is a GitHub prerelease and never replaces stable/latest'
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta

# The source build never gets production signing secrets or write permissions.
permissions:
  contents: read

concurrency:
  group: phantom-official-release-build
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned universal APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Validate commit reference
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Provide an exact 40-char commit SHA"; exit 1; }
      - name: Checkout selected source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Setup Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Ensure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          test -n "$SDKMGR"
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Download pinned VPN engines and routing assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs app/src/main/assets
          curl --retry 3 -fSL -o app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar
          echo 'cdfef146218233a31a8b52c8b1016557730d3b63fc121d4c84cacea50e669155  app/libs/libv2ray.aar' | sha256sum -c -
          curl --retry 3 -fSL -o app/libs/libbox-original.aar https://github.com/singbox-android/libbox/releases/download/1.14.4/libbox.aar
          echo 'd2685924a657705beda44e94c6dc499e781df1ad20d65474e3591ec2f8b96465  app/libs/libbox-original.aar' | sha256sum -c -
          echo 'lief==1.0.0 --hash=sha256:41ff868f5328fc8e5237a9e1f4718590e0ee9180c1422b3e4948b7116ba4517c' > "$RUNNER_TEMP/lief.txt"
          python3 -m pip install --no-cache-dir --user --only-binary=:all: --no-deps --require-hashes -r "$RUNNER_TEMP/lief.txt"
          python3 scripts/isolate_libbox_aar.py app/libs/libbox-original.aar app/libs/libbox-isolated.aar
          rm -f app/libs/libbox-original.aar
          curl --retry 3 -fSL -o app/src/main/assets/geoip.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/202611152204/geoip.dat
          curl --retry 3 -fSL -o app/src/main/assets/geosite.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/202611152204/geosite.dat
          echo '304ac8a1cbcc8166e4f5a4f32955e4d0fb77a1bd713583e371b30ee27f3659d8  app/src/main/assets/geoip.dat' | sha256sum -c -
          echo '269f7740e328b592376ea99f2adb12f83d5bc17b024e584c8a7b3706ba5c789d  app/src/main/assets/geosite.dat' | sha256sum -c -
      - name: Compile APK (no emulator tests)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload unsigned APK to isolated signing job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phantom-quick-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  sign:
    name: Sign APK with official Phantom key
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch unsigned APK (never execute source code in signer)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phantom-quick-unsigned
          path: unsigned
      - name: Ensure Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          test -n "$SDKMGR"
          "$SDKMGR" --install "build-tools;35.0.0"
      - name: Validate package and sign separately
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.APP_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD"
          test -n "$KEYSTORE_ALIAS" && test -n "$KEY_PASSWORD"
          apk=unsigned/app-release-unsigned.apk
          test -s "$apk"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          zipalign="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$aapt" dump badging "$apk" | grep -F "package: name='xyz.wraithnet.phantom'"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/phantom-keystore.jks"
          mkdir -p signed
          "$zipalign" -P 16 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$apksigner" sign --ks "$RUNNER_TEMP/phantom-keystore.jks" \
            --ks-key-alias "$KEYSTORE_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --v4-signing-enabled false \
            --out signed/Phantom.apk "$RUNNER_TEMP/aligned.apk"
          "$apksigner" verify --print-certs signed/Phantom.apk | grep -Fx \
            'Signer #1 certificate SHA-256 digest: 86bc0b32349dec451d94ed402a1addc1ad3ec6084439cb8dc05aee88e5d8a4ca'
          "$zipalign" -c -P 16 4 signed/Phantom.apk
          "$aapt" dump badging signed/Phantom.apk | grep -F "package: name='xyz.wraithnet.phantom'"
          sha256sum signed/Phantom.apk
          # Bind the signed binary to its reviewed source commit for releases.
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          printf '%s\n' "$SOURCE_SHA" > signed/source-commit.txt
          rm -f "$RUNNER_TEMP/phantom-keystore.jks" "$RUNNER_TEMP/aligned.apk"
      - name: Upload official-signature APK for manual testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phantom-quick-official-signed
          path: |
            signed/Phantom.apk
            signed/source-commit.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  delta:
    name: Create verified differential APK assets
    needs: sign
    if: ${{ inputs.publish_release == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact delta source without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Fetch verified signed target APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phantom-quick-official-signed
          path: signed
      - name: Generate and verify signed APK deltas from recent versions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(cat signed/source-commit.txt)" = "$SOURCE_SHA"
          mkdir -p delta previous
          stable=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          stable_date=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$stable" --jq .published_at)
          # An ancient beta (for example v0.3.7) is not worth 184 MB of
          # extra downloading when a newer stable already superseded it.
          beta=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -r --arg after "$stable_date" '[.[] | select(
              .prerelease == true and .draft == false and
              .published_at > $after and (.tag_name | contains("-beta.")))] |
              sort_by(.published_at) | last | .tag_name // empty')
          while read -r tag; do
            [[ -n "$tag" ]] || continue
            echo "Generate verified patch from $tag"
            mkdir -p "previous/$tag"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern phantom-universal-release.apk --dir "previous/$tag" --clobber
            python3 scripts/build_apk_delta.py \
              --base "previous/$tag/phantom-universal-release.apk" \
              --target signed/Phantom.apk \
              --output "delta/phantom-delta-from-$tag.apkdelta"
          done < <(printf '%s\n' "$stable" "$beta" |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[1-9][0-9]*)?$' | sort -u)
          for file in delta/*.apkdelta; do
            [[ -f "$file" ]] || continue
            sha256sum "$file"
          done
          touch delta/manifest.txt
      - name: Upload verified patch files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phantom-quick-deltas
          path: delta/
          retention-days: 2
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish one official stable APK and OTA
    needs: [sign, delta]
    if: ${{ inputs.publish_release == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      # Do not execute untrusted project code in this write-enabled job.
      - name: Fetch signed APK from isolated signer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phantom-quick-official-signed
          path: release-assets
      - name: Retrieve generated patches
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phantom-quick-deltas
          path: release-assets/deltas
      - name: Validate signed source and next version
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          CHANNEL: ${{ inputs.release_channel }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CHANNEL" == stable || "$CHANNEL" == beta ]]
          test -s release-assets/Phantom.apk
          test "$(cat release-assets/source-commit.txt)" = "$SOURCE_SHA"
          test "$(find release-assets -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          test "$(stat -c '%s' release-assets/Phantom.apk)" -lt 262144000
          gh api "repos/$GITHUB_REPOSITORY/contents/app/build.gradle.kts?ref=$SOURCE_SHA" \
            --jq .content | base64 -d > "$RUNNER_TEMP/source-gradle.kts"
          code=$(awk '/^[[:space:]]*versionCode =/ { print $3; exit }' "$RUNNER_TEMP/source-gradle.kts")
          version=$(awk -F '"' '/^[[:space:]]*versionName =/ { print $2; exit }' "$RUNNER_TEMP/source-gradle.kts")
          [[ "$code" =~ ^[0-9]+$ ]]
          if [[ "$CHANNEL" == stable ]]; then
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "::error::Stable channel requires X.Y.Z versionName"; exit 1;
            }
          else
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[1-9][0-9]*$ ]] || {
              echo "::error::Beta channel requires X.Y.Z-beta.N versionName"; exit 1;
            }
          fi
          tag="v$version"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists"; exit 1
          fi
          previous=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          gh api "repos/$GITHUB_REPOSITORY/contents/app/build.gradle.kts?ref=$previous" \
            --jq .content | base64 -d > "$RUNNER_TEMP/previous-gradle.kts"
          oldcode=$(awk '/^[[:space:]]*versionCode =/ { print $3; exit }' "$RUNNER_TEMP/previous-gradle.kts")
          [[ "$oldcode" =~ ^[0-9]+$ ]]
          if (( code <= oldcode )); then
            echo "::error::versionCode $code must exceed stable $oldcode"; exit 1
          fi
          # Stable and beta share the same Android applicationId: versionCode
          # must increase across BOTH channels, or switching channels can
          # make the next update uninstallable.
          last_beta=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -r '[.[] | select(.prerelease == true and .draft == false and
              (.tag_name | contains("-beta.")))] | sort_by(.published_at) |
              last | .tag_name // empty')
          if [[ -n "$last_beta" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/contents/app/build.gradle.kts?ref=$last_beta" \
              --jq .content | base64 -d > "$RUNNER_TEMP/beta-gradle.kts"
            last_beta_code=$(awk '/^[[:space:]]*versionCode =/ { print $3; exit }' "$RUNNER_TEMP/beta-gradle.kts")
            [[ "$last_beta_code" =~ ^[0-9]+$ ]]
            if (( code <= last_beta_code )); then
              echo "::error::versionCode $code must exceed beta $last_beta_code"; exit 1
            fi
          fi
          gh api "repos/$GITHUB_REPOSITORY/contents/RELEASE_NOTES.md?ref=$SOURCE_SHA" \
            --jq .content | base64 -d > "$RUNNER_TEMP/notes.md"
          grep -Fxq "# PHANTOM VPN $version" "$RUNNER_TEMP/notes.md"
          printf "\nОфициальная быстрая сборка. Полный Android/TV аудит запускается отдельно.\n" >> "$RUNNER_TEMP/notes.md"
          mv release-assets/Phantom.apk release-assets/phantom-universal-release.apk
          sha256sum release-assets/phantom-universal-release.apk
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous_stable=$previous" >> "$GITHUB_OUTPUT"
      - name: Publish stable release on permanent download link
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          TAG: ${{ steps.meta.outputs.tag }}
          CHANNEL: ${{ inputs.release_channel }}
        run: |
          set -euo pipefail
          flags=(--latest)
          if [[ "$CHANNEL" == beta ]]; then flags=(--prerelease --latest=false); fi
          files=(release-assets/phantom-universal-release.apk)
          for patch in release-assets/deltas/*.apkdelta; do
            [[ -f "$patch" ]] && files+=("$patch")
          done
          gh release create "$TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "PHANTOM VPN $TAG" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
      - name: Verify release, single asset and SHA-256
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          CHANNEL: ${{ inputs.release_channel }}
          PREVIOUS_STABLE: ${{ steps.meta.outputs.previous_stable }}
        run: |
          set -euo pipefail
          sha="sha256:$(sha256sum release-assets/phantom-universal-release.apk | cut -d' ' -f1)"
          expected_beta=false
          if [[ "$CHANNEL" == beta ]]; then expected_beta=true; fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" |
            jq -e --arg digest "$sha" --argjson beta "$expected_beta" '
              .draft == false and .prerelease == $beta and
              ([.assets[] | select(.name == "phantom-universal-release.apk" and
                .state == "uploaded" and .digest == $digest)] | length) == 1
            '
          for file in release-assets/deltas/*.apkdelta; do
            [[ -f "$file" ]] || continue
            filename=$(basename "$file")
            expected="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" |
              jq -e --arg name "$filename" --arg digest "$expected" '
                ([.assets[] | select(.name == $name and .digest == $digest and
                   .state == "uploaded")] | length) == 1'
          done
          if [[ "$CHANNEL" == stable ]]; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$TAG"
          else
            test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$PREVIOUS_STABLE"
          fi
          echo "Permanent official APK: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/phantom-universal-release.apk"
