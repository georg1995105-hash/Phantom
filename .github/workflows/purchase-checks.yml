name: Purchase and device UI checks
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'app/**'
      - '.github/workflows/purchase-checks.yml'
permissions:
  contents: read
concurrency:
  group: purchase-ui-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Prepare pinned Android libraries
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl --retry 3 -fSL -o app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar
          echo 'cdfef146218233a31a8b52c8b1016557730d3b63fc121d4c84cacea50e669155  app/libs/libv2ray.aar' | sha256sum -c -
          curl --retry 3 -fSL -o app/libs/libbox-original.aar https://github.com/singbox-android/libbox/releases/download/1.14.4/libbox.aar
          echo 'd2685924a657705beda44e94c6dc499e781df1ad20d65474e3591ec2f8b96465  app/libs/libbox-original.aar' | sha256sum -c -
          echo 'lief==1.0.0 --hash=sha256:41ff868f5328fc8e5237a9e1f4718590e0ee9180c1422b3e4948b7116ba4517c' > "$RUNNER_TEMP/lief.txt"
          python3 -m pip install --user --no-deps --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/lief.txt"
          python3 scripts/isolate_libbox_aar.py app/libs/libbox-original.aar app/libs/libbox-isolated.aar
          rm app/libs/libbox-original.aar
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0'
          ./gradlew --no-daemon --max-workers=1 -PnativeSmoke :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Allow test emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Phone, landscape tablet and TV focused UI checks
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            ./gradlew --no-daemon --max-workers=1 -PnativeSmoke -Pandroid.testInstrumentationRunnerArguments.class=xyz.wraithnet.phantom.ui.NativeDevicesUiTest,xyz.wraithnet.phantom.ui.NativePurchaseUiTest,xyz.wraithnet.phantom.ui.SubscriptionStorefrontUiTest,xyz.wraithnet.phantom.ui.home.TvSubscriptionTextUiTest,xyz.wraithnet.phantom.data.PurchaseVaultTest :app:connectedDebugAndroidTest
            adb shell wm size 1920x1200
            adb shell wm density 240
            ./gradlew --no-daemon --max-workers=1 -PnativeSmoke -Pandroid.testInstrumentationRunnerArguments.class=xyz.wraithnet.phantom.ui.NativeDevicesUiTest,xyz.wraithnet.phantom.ui.NativePurchaseUiTest :app:connectedDebugAndroidTest
      - name: Keep actual instrumentation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: purchase-device-ui-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
